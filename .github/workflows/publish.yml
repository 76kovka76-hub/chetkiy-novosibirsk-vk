name: Чёткий Новосибирск — новости ВК

on:
  schedule:
    - cron: "1-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chetkiy-novosibirsk-vk-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout project
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest -v test_bot.py
      - name: Check Novosibirsk VK token on manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          NOVOSIBIRSK_VK_TOKEN: ${{ secrets.NOVOSIBIRSK_VK_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NOVOSIBIRSK_VK_TOKEN" ]]; then
            echo "::error::Missing NOVOSIBIRSK_VK_TOKEN"
            exit 1
          fi
          echo "Token for Novosibirsk exists (value hidden)."
      - name: Publish fresh Novosibirsk news or subscriber game
        env:
          NOVOSIBIRSK_VK_TOKEN: ${{ secrets.NOVOSIBIRSK_VK_TOKEN }}
          DRY_RUN: "false"
        run: python main.py
      - name: Save publishing history if changed
        if: success()
        run: |
          if [[ -n "$(git status --porcelain history.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.json
            git commit -m "Update Novosibirsk publication history"
            git pull --rebase
            git push
          fi
